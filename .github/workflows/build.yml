name: Build

# push 时自动编译三条链：
#   1) PC 端 Release（windows-latest，含 pfsshell 源码编译 + tools 打包 + 测试）
#   2) Mac 端 Release（macos-latest，Avalonia UI + macOS pfsshell 源码编译 + .app 打包 + 测试）
#   3) PS2 端 PfsNetServer.elf（ubuntu-latest + 362053534 的 Docker 编译镜像）
# 产物统一用 upload-artifact 提供下载。
#
# 提速（PC job 实测 200s → 缓存命中 93s）：
#   - pfsshell（win32 / macos）按上游 HEAD SHA 用 actions/cache 预热：命中就整段跳过
#     工具链安装、clone 源码与 meson 编译；
#   - 主工程与 Tests 合成一次 Release 编译（原来 145 KB 的 MainForm.cs 被编两遍，
#     且回归测试跑的是 Debug 二进制、发的是 Release）；
#   - 没动的：setup-dotnet 那 31s。`dotnet-version: 8.0.x` 是区间，动作会下载镜像里
#     没有的最新补丁；钉成镜像自带的 8.0.424 即可降到几秒，只是以后要跟着镜像换版本号。
#
# 关于压缩层数：csproj 的 ZipReleaseOutput / build-release-mac.sh 已经产出可分发 zip（第 1 层）。
# upload-artifact 默认还会把上传内容再打成一个 zip（第 2 层，纯浪费：已 deflate 的内容体积几乎不变，还得解压两次）。
# 所以 PC 端与 Mac 端的 zip 均用 @v7 + `archive: false`「直传」，下载即得可用的 zip。
#   注意：archive: false 只允许单个文件，且 `name` 输入被忽略，
#         artifact 名 = 文件名（所以先把 zip 复制成带 -windows / -macos 后缀的名字）。
#   ELF 仍走默认打包：它没被压过，外层 zip 是有效压缩，不算重复。
#
# pfsshell 不需要单独出 artifact：meson 编出的 pfsshell 二进制直接打进各自平台的 tools/，随发行 zip 一起分发。
#
# 上游依赖（全部来自 362053534，见 AGENTS.md）：
#   - 362053534/pfsshell            → tools\pfsshell.exe (Windows) / tools/pfsshell (macOS)
#   - 362053534/PFS-BatchKit-Manager→ tools\{hdl_dump.exe,wnbd-client.exe,libwnbd.dll}
#   - ghcr.io/362053534/ps2homebrew:main → 内含 362053534/ps2toolchain + ps2sdk + ps2sdk-ports
#     的编译产物（PS2SDK=/usr/local/ps2dev/ps2sdk，含 iop/irx/*.irx）

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PFS_SHELL_REPO: 362053534/pfsshell
  PFS_SHELL_REF: master
  BATCHKIT_REPO: 362053534/PFS-BatchKit-Manager
  BATCHKIT_REF: main
  PS2_IMAGE: ghcr.io/362053534/ps2homebrew:main
  # 镜像里预编译好的 SDK；不要用 /usr/local/ps2sdk（那只是源码 clone）
  PS2SDK_IN_IMAGE: /usr/local/ps2dev/ps2sdk

jobs:
  # ---------------------------------------------------------------- PC 端
  pc-release:
    name: PC Release (net8.0-windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # csproj 里写死了相对路径，这里按作者本机 C:\GitHub\ 的布局还原：
      #   ..\..\pfsshell\build-local-win32\pfsshell.exe
      #   ..\PFS-BatchKit-Manager\BAT\{hdl_dump,wnbd-client}.exe + libwnbd.dll
      # 因此本仓库必须落在 <workspace>/PFS-BatchKit-Manager/PS2-HDD-File-Manager
      # ---- pfsshell 预热：上游 master 很少变，但每次 push 都要重装 MSYS2 + 重编，
      # 实测白烧 118 s（装工具链 102 s + 编译 10 s + checkout 6 s），占整个 job 的 59%。
      # 这里按「上游 HEAD SHA」缓存编好的 pfsshell.exe：命中就跳过 clone / msys2 / 编译，
      # 只有 pfsshell 自己更新了才会走一遍完整链路。
      - name: 取 pfsshell 上游 HEAD SHA
        id: pfsshell-sha
        run: |
          # 分支 / 标签 / 裸 SHA 都能解析（^{} 是标签指向的对象，跳过）
          sha="$(git ls-remote "https://github.com/${PFS_SHELL_REPO}.git" \
                   "refs/heads/${PFS_SHELL_REF}" "refs/tags/${PFS_SHELL_REF}" "${PFS_SHELL_REF}" 2>/dev/null \
                 | awk '$2 !~ /\^\{\}$/ {print $1; exit}')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            # 解析失败（网络抖动 / 上游改成私有）就整体退回全量编译：
            # sha=skip 时不查缓存，cache-hit 为空 → 后面的编译步骤照常跑
            echo "::warning::取不到 ${PFS_SHELL_REPO}@${PFS_SHELL_REF} 的 SHA（得到：'$sha'），本次跳过缓存、全量编译 pfsshell"
            echo "sha=skip" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "pfsshell ${PFS_SHELL_REF} = $sha"
          fi

      - name: 还原 pfsshell.exe 缓存
        id: pfsshell-cache
        if: steps.pfsshell-sha.outputs.sha != 'skip'
        uses: actions/cache@v4
        with:
          # 只缓存 csproj 真正要的那个文件，别把整个 build 目录（含 meson 中间产物）拖进来
          path: pfsshell/build-local-win32/pfsshell.exe
          # 上游 SHA 变了自动失效。缓存的是 -static 链接的独立 exe，
          # 换 runner 镜像也不会失配，所以 key 里只放 os/arch。
          key: pfsshell-exe-${{ runner.os }}-${{ runner.arch }}-${{ steps.pfsshell-sha.outputs.sha }}

      - name: Checkout pfsshell 源码
        if: steps.pfsshell-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PFS_SHELL_REPO }}
          ref: ${{ env.PFS_SHELL_REF }}
          path: pfsshell

      - name: 准备 MSYS2 MINGW32 工具链
        if: steps.pfsshell-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          # p7zip 仅仅是 meson 的 configure 硬依赖：meson.build 里那个 Windows 分支的
          # archive custom_target 用了 find_program('7z')（默认 required: true），缺 7z
          # 连 `meson setup` 都过不去。它产出的 pfsshell-*-win32.7z 我们不需要，也不上传。
          # 想彻底不装 p7zip，只能改上游 362053534/pfsshell 的 meson.build（required:false
          # + build_by_default:false 或加个 option）。
          install: >-
            base-devel
            git
            p7zip
            mingw-w64-i686-gcc
            mingw-w64-i686-meson
            mingw-w64-i686-ninja

      # 不启用 pfsfuse，因此不需要 external/dokany 等子模块
      # 失败时把日志尾部塞进 ::error:: annotation（Actions 日志在 blob 存储里，annotation 走 API 可读）
      - name: 编译 pfsshell.exe
        if: steps.pfsshell-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          W="$(cygpath -u "${{ github.workspace }}")"
          echo "workspace=$W"
          cd "$W/pfsshell" || { echo "::error::进入 pfsshell 目录失败: $W/pfsshell"; exit 1; }
          pwd
          for t in gcc meson ninja python3 pkg-config; do printf '%-11s ' "$t"; command -v "$t" || echo 'NOT FOUND'; done
          gcc --version | head -1 || true
          meson --version || true
          if ! meson setup build-local-win32 -Denable_pfs2tar=true > setup.log 2>&1; then
            echo "::error::meson setup 失败::$(tail -n 25 setup.log | tr -d '\r' | tr '\n' '|')"
            exit 1
          fi
          if ! meson compile -C build-local-win32 > compile.log 2>&1; then
            echo "::error::meson compile 失败::$(tail -n 25 compile.log | tr -d '\r' | tr '\n' '|')"
            exit 1
          fi
          # 空文件绝不能进缓存（actions/cache 的 post 步骤不看构建结果）
          test -s build-local-win32/pfsshell.exe || { echo "::error::pfsshell.exe 没生成或为 0 字节"; exit 1; }
          ls -l build-local-win32/pfsshell.exe

      - name: 取 PFS-BatchKit-Manager 的工具（sparse，仅 3 个文件）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BATCHKIT_REPO }}
          ref: ${{ env.BATCHKIT_REF }}
          path: PFS-BatchKit-Manager
          sparse-checkout: |
            PFS-BatchKit-Manager/BAT/hdl_dump.exe
            PFS-BatchKit-Manager/BAT/wnbd-client.exe
            PFS-BatchKit-Manager/BAT/libwnbd.dll
          sparse-checkout-cone-mode: false

      - name: Checkout 本仓库
        uses: actions/checkout@v4
        with:
          path: PFS-BatchKit-Manager/PS2-HDD-File-Manager

      - name: 校验 4 个 tools 依赖就位
        working-directory: PFS-BatchKit-Manager/PS2-HDD-File-Manager
        run: |
          set -e
          for f in \
            ../../pfsshell/build-local-win32/pfsshell.exe \
            ../PFS-BatchKit-Manager/BAT/hdl_dump.exe \
            ../PFS-BatchKit-Manager/BAT/wnbd-client.exe \
            ../PFS-BatchKit-Manager/BAT/libwnbd.dll
          do
            test -s "$f" || { echo "缺失依赖: $f"; exit 1; }
            printf '%10d  %s\n' "$(stat -c %s "$f")" "$f"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 只调一次 MSBuild：编 Tests 工程会经 ProjectReference 顺带把主工程也编成 Release，
      # 主工程的 ZipReleaseOutput 目标照常产出发行 zip。
      # （以前这里是 build 主工程(Release) + dotnet run 测试(默认 Debug)，
      #   MainForm.cs 那种 145 KB 的文件被完整编了两遍，而且跑的是 Debug 二进制、
      #   发的却是 Release 二进制。）
      - name: 编译 Release（主工程 + Tests，含 tools 复制与 zip 打包）
        working-directory: PFS-BatchKit-Manager/PS2-HDD-File-Manager
        run: |
          if ! dotnet build Tests/PS2-HDD-File-Manager.Tests.csproj -c Release --nologo > build.log 2>&1; then
            echo "::error::dotnet build 失败::$(tail -n 30 build.log | tr -d '\r' | tr '\n' '|')"
            exit 1
          fi
          tail -n 5 build.log

      # --no-build：直接跑上一步编好的 Release 产物，不再触发第二次编译
      - name: 运行回归测试
        working-directory: PFS-BatchKit-Manager/PS2-HDD-File-Manager
        run: |
          if ! dotnet run --project Tests/PS2-HDD-File-Manager.Tests.csproj -c Release --no-build > tests.log 2>&1; then
            echo "::error::回归测试失败::$(tail -n 30 tests.log | tr -d '\r' | tr '\n' '|')"
            exit 1
          fi
          cat tests.log

      - name: 校验产物并准备上传
        working-directory: PFS-BatchKit-Manager/PS2-HDD-File-Manager
        run: |
          set -e
          zip=bin/Release/PS2-HDD-File-Manager.zip
          test -s bin/Release/net8.0-windows/PS2-HDD-File-Manager.exe
          test -s "$zip"
          ls -l bin/Release/net8.0-windows/tools/
          # 这是 tools 四件套唯一的把关点：pfsshell.exe 由 meson 编出后经 csproj 的
          # Link="tools\pfsshell.exe" 复制进输出目录，再被 ZipReleaseOutput 打进 zip，
          # 不再额外上传 pfsshell-win32 artifact。
          # Windows PowerShell 的 Compress-Archive 条目名用反斜杠，先统一成斜杠再比。
          names="$(unzip -Z1 "$zip" | tr '\\' '/')"
          for f in PS2-HDD-File-Manager.exe \
                   tools/pfsshell.exe tools/hdl_dump.exe tools/wnbd-client.exe tools/libwnbd.dll
          do
            printf '%s\n' "$names" | grep -qxF "$f" \
              || { echo "::error::发行 zip 缺少 $f（tools 复制或 ZipReleaseOutput 出问题）"; exit 1; }
          done
          # pdb 必须已剔除
          if printf '%s\n' "$names" | grep -q '\.pdb$'; then
            echo "::error::发行 zip 里混进了 *.pdb（ZipReleaseOutput 的剔除逻辑失效）"
            exit 1
          fi
          printf '%d 个条目\n' "$(printf '%s\n' "$names" | wc -l)"
          # archive: false 时 artifact 名取自文件名，所以复制成期望的名字再直传
          cp "$zip" "$GITHUB_WORKSPACE/PS2-HDD-File-Manager-Release-windows.zip"
          ls -l "$GITHUB_WORKSPACE/PS2-HDD-File-Manager-Release-windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: PS2-HDD-File-Manager-Release-windows.zip
          archive: false # 不再套一层 artifact zip，下载即得可用 zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Mac 端
  mac-release:
    name: Mac Release (Swift universal, macOS 12+)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4
        with:
          path: PS2-HDD-File-Manager

      - name: 取 pfsshell 上游 HEAD SHA
        id: pfsshell-sha
        run: |
          sha="$(git ls-remote "https://github.com/${PFS_SHELL_REPO}.git" \
                   "refs/heads/${PFS_SHELL_REF}" "refs/tags/${PFS_SHELL_REF}" "${PFS_SHELL_REF}" 2>/dev/null \
                 | awk '$2 !~ /\^\{\}$/ {print $1; exit}')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::取不到 ${PFS_SHELL_REPO}@${PFS_SHELL_REF} 的 SHA（得到：'$sha'），本次跳过缓存、全量编译 pfsshell"
            echo "sha=skip" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "pfsshell ${PFS_SHELL_REF} = $sha"
          fi

      - name: 还原 pfsshell (macOS) 缓存
        id: pfsshell-cache
        if: steps.pfsshell-sha.outputs.sha != 'skip'
        uses: actions/cache@v4
        with:
          path: pfsshell/build-local-macos/pfsshell
          key: pfsshell-macos-monterey12-universal-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pfsshell-sha.outputs.sha }}

      - name: Checkout pfsshell 源码
        if: steps.pfsshell-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PFS_SHELL_REPO }}
          ref: ${{ env.PFS_SHELL_REF }}
          path: pfsshell

      - name: 编译 Monterey 通用 pfsshell
        if: steps.pfsshell-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/monterey-buildtools"
          "$RUNNER_TEMP/monterey-buildtools/bin/python3" -m pip install meson ninja
          export PATH="$RUNNER_TEMP/monterey-buildtools/bin:$PATH"
          PS2-HDD-File-Manager/macOS/build-pfsshell.sh "$GITHUB_WORKSPACE/pfsshell" "$GITHUB_WORKSPACE/pfsshell/build-local-macos/pfsshell"

      - name: 编译并打包 macOS Release (.app)
        working-directory: PS2-HDD-File-Manager
        run: |
          chmod +x ./build-release-mac.sh ./ ../pfsshell/build-local-macos/pfsshell || true
          if ! PFSSHELL_BIN="$GITHUB_WORKSPACE/pfsshell/build-local-macos/pfsshell" ./build-release-mac.sh > build-mac.log 2>&1; then
            echo "::error::macOS Release 编译失败::$(tail -n 30 build-mac.log | tr '\n' '|')"
            cat build-mac.log
            exit 1
          fi
          tail -n 10 build-mac.log

      - name: 运行 macOS 回归测试与 pfsshell 冒烟测试
        working-directory: PS2-HDD-File-Manager
        run: |
          set -e
          app_bin="bin/Release/PS2-HDD-File-Manager.app/Contents/MacOS/PS2-HDD-File-Manager"
          pfs_bin="bin/Release/PS2-HDD-File-Manager.app/Contents/MacOS/tools/pfsshell"
          if ! "$app_bin" --run-tests > tests-mac.log 2>&1; then
            echo "::error::macOS 回归测试失败::$(tail -n 30 tests-mac.log | tr '\n' '|')"
            cat tests-mac.log
            exit 1
          fi
          cat tests-mac.log
          help_out="$(printf 'help\nexit\n' | "$pfs_bin" 2>&1 || true)"
          printf '%s\n' "$help_out" | grep -q '~Command List~' \
            || { echo "::error::macOS pfsshell 冒烟测试失败"; printf '%s\n' "$help_out"; exit 1; }

      - name: 校验 macOS 产物并准备上传
        working-directory: PS2-HDD-File-Manager
        run: |
          set -e
          zip="bin/Release/PS2-HDD-File-Manager-Release-macos.zip"
          test -s "$zip"
          names="$(unzip -Z1 "$zip")"
          for f in \
            "PS2-HDD-File-Manager.app/Contents/Info.plist" \
            "PS2-HDD-File-Manager.app/Contents/MacOS/PS2-HDD-File-Manager" \
            "PS2-HDD-File-Manager.app/Contents/MacOS/tools/pfsshell"
          do
            printf '%s\n' "$names" | grep -qxF "$f" \
              || { echo "::error::macOS 发行 zip 缺少 $f"; exit 1; }
          done
          if printf '%s\n' "$names" | grep -q '\.pdb$'; then
            echo "::error::macOS 发行 zip 里混进了 *.pdb"
            exit 1
          fi
          printf '%d 个条目\n' "$(printf '%s\n' "$names" | wc -l)"
          cp "$zip" "$GITHUB_WORKSPACE/PS2-HDD-File-Manager-Release-macos.zip"
          ls -lh "$GITHUB_WORKSPACE/PS2-HDD-File-Manager-Release-macos.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: PS2-HDD-File-Manager-Release-macos.zip
          archive: false
          if-no-files-found: error

  # -------------------------------------------------------------- PS2 端
  ps2-elf:
    name: PS2 ELF (PfsNetServer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr（镜像为私有时需要）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取编译镜像
        run: docker pull "$PS2_IMAGE"

      # 与 ps2-server/scripts/build.ps1 -Docker 等价：
      # make clean 会删掉仓库内已提交的 *_irx.c/.o，再由 bin2c 从 SDK 的 IRX 重新生成
      - name: 编译 PfsNetServer.elf
        run: |
          docker run --rm \
            -e PS2SDK="$PS2SDK_IN_IMAGE" \
            -v "$GITHUB_WORKSPACE/ps2-server:/src" \
            -w /src \
            "$PS2_IMAGE" \
            sh -c 'set -e; command -v mips64r5900el-ps2-elf-gcc; command -v bin2c; make clean || true; make all; ls -la PfsNetServer.elf'

      - name: 归还文件属主
        run: sudo chown -R "$(id -u):$(id -g)" ps2-server

      - name: 校验 ELF
        run: |
          set -e
          test -s ps2-server/PfsNetServer.elf
          printf 'magic: '; head -c 4 ps2-server/PfsNetServer.elf | od -An -c | tr -s ' '
          strings ps2-server/PfsNetServer.elf | grep -m1 '^PfsNetServer$'

      # 这里刻意不用 archive: false：ELF 未被压缩过，artifact 的那层 zip 是有效的
      # （约 2.7 MB → 1.0 MB），不存在「zip 套 zip」的重复压缩问题。
      - uses: actions/upload-artifact@v7
        with:
          name: PfsNetServer-elf
          path: ps2-server/PfsNetServer.elf
          if-no-files-found: error
