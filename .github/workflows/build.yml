name: Build

# push 时自动编译两条链：
#   1) PC 端 Release（windows-latest，含 pfsshell 源码编译 + tools 打包 + 测试）
#   2) PS2 端 PfsNetServer.elf（ubuntu-latest + 362053534 的 Docker 编译镜像）
# 产物统一用 upload-artifact 提供下载。
#
# 上游依赖（全部来自 362053534，见 AGENTS.md）：
#   - 362053534/pfsshell            → tools\pfsshell.exe（meson 源码编译）
#   - 362053534/PFS-BatchKit-Manager→ tools\{hdl_dump.exe,wnbd-client.exe,libwnbd.dll}
#   - ghcr.io/362053534/ps2homebrew:main → 内含 362053534/ps2toolchain + ps2sdk + ps2sdk-ports
#     的编译产物（PS2SDK=/usr/local/ps2dev/ps2sdk，含 iop/irx/*.irx）

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PFS_SHELL_REPO: 362053534/pfsshell
  PFS_SHELL_REF: master
  BATCHKIT_REPO: 362053534/PFS-BatchKit-Manager
  BATCHKIT_REF: main
  PS2_IMAGE: ghcr.io/362053534/ps2homebrew:main
  # 镜像里预编译好的 SDK；不要用 /usr/local/ps2sdk（那只是源码 clone）
  PS2SDK_IN_IMAGE: /usr/local/ps2dev/ps2sdk

jobs:
  # ---------------------------------------------------------------- PC 端
  pc-release:
    name: PC Release (net8.0-windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # csproj 里写死了相对路径，这里按作者本机 C:\GitHub\ 的布局还原：
      #   ..\..\pfsshell\build-local-win32\pfsshell.exe
      #   ..\PFS-BatchKit-Manager\BAT\{hdl_dump,wnbd-client}.exe + libwnbd.dll
      # 因此本仓库必须落在 <workspace>/PFS-BatchKit-Manager/PS2-HDD-File-Manager
      - name: Checkout pfsshell 源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PFS_SHELL_REPO }}
          ref: ${{ env.PFS_SHELL_REF }}
          path: pfsshell

      - name: 准备 MSYS2 MINGW32 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            base-devel
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-meson
            mingw-w64-i686-ninja

      # 不启用 pfsfuse，因此不需要 external/dokany 等子模块
      - name: 编译 pfsshell.exe
        shell: msys2 {0}
        run: |
          set -e
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/pfsshell"
          meson setup build-local-win32 -Denable_pfs2tar=true
          meson compile -C build-local-win32
          ls -l build-local-win32/pfsshell.exe

      - name: 取 PFS-BatchKit-Manager 的工具（sparse，仅 3 个文件）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BATCHKIT_REPO }}
          ref: ${{ env.BATCHKIT_REF }}
          path: PFS-BatchKit-Manager
          sparse-checkout: |
            PFS-BatchKit-Manager/BAT/hdl_dump.exe
            PFS-BatchKit-Manager/BAT/wnbd-client.exe
            PFS-BatchKit-Manager/BAT/libwnbd.dll
          sparse-checkout-cone-mode: false

      - name: Checkout 本仓库
        uses: actions/checkout@v4
        with:
          path: PFS-BatchKit-Manager/PS2-HDD-File-Manager

      - name: 校验 4 个 tools 依赖就位
        working-directory: PFS-BatchKit-Manager/PS2-HDD-File-Manager
        run: |
          set -e
          for f in \
            ../../pfsshell/build-local-win32/pfsshell.exe \
            ../PFS-BatchKit-Manager/BAT/hdl_dump.exe \
            ../PFS-BatchKit-Manager/BAT/wnbd-client.exe \
            ../PFS-BatchKit-Manager/BAT/libwnbd.dll
          do
            test -s "$f" || { echo "缺失依赖: $f"; exit 1; }
            printf '%10d  %s\n' "$(stat -c %s "$f")" "$f"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 编译 Release（含 tools 复制 + zip 打包）
        working-directory: PFS-BatchKit-Manager/PS2-HDD-File-Manager
        run: dotnet build PS2-HDD-File-Manager.csproj -c Release --nologo

      - name: 运行回归测试
        working-directory: PFS-BatchKit-Manager/PS2-HDD-File-Manager
        run: dotnet run --project Tests/PS2-HDD-File-Manager.Tests.csproj

      - name: 校验产物
        working-directory: PFS-BatchKit-Manager/PS2-HDD-File-Manager
        run: |
          set -e
          test -s bin/Release/net8.0-windows/PS2-HDD-File-Manager.exe
          test -s bin/Release/PS2-HDD-File-Manager.zip
          ls -l bin/Release/net8.0-windows/tools/
          unzip -l bin/Release/PS2-HDD-File-Manager.zip | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: PS2-HDD-File-Manager-Release-windows
          path: PFS-BatchKit-Manager/PS2-HDD-File-Manager/bin/Release/PS2-HDD-File-Manager.zip
          if-no-files-found: error

  # -------------------------------------------------------------- PS2 端
  ps2-elf:
    name: PS2 ELF (PfsNetServer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr（镜像为私有时需要）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取编译镜像
        run: docker pull "$PS2_IMAGE"

      # 与 ps2-server/scripts/build.ps1 -Docker 等价：
      # make clean 会删掉仓库内已提交的 *_irx.c/.o，再由 bin2c 从 SDK 的 IRX 重新生成
      - name: 编译 PfsNetServer.elf
        run: |
          docker run --rm \
            -e PS2SDK="$PS2SDK_IN_IMAGE" \
            -v "$GITHUB_WORKSPACE/ps2-server:/src" \
            -w /src \
            "$PS2_IMAGE" \
            sh -c 'set -e; command -v mips64r5900el-ps2-elf-gcc; command -v bin2c; make clean || true; make all; ls -la PfsNetServer.elf'

      - name: 归还文件属主
        run: sudo chown -R "$(id -u):$(id -g)" ps2-server

      - name: 校验 ELF
        run: |
          set -e
          test -s ps2-server/PfsNetServer.elf
          printf 'magic: '; head -c 4 ps2-server/PfsNetServer.elf | od -An -c | tr -s ' '
          strings ps2-server/PfsNetServer.elf | grep -m1 '^PfsNetServer$'

      - uses: actions/upload-artifact@v4
        with:
          name: PfsNetServer-elf
          path: ps2-server/PfsNetServer.elf
          if-no-files-found: error
